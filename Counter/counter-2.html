<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Counter</h1>
    <h2>0</h2>
    <button onclick="data()">increment</button>
    <button onclick="Cota()">Decrement</button>
    <button onclick="Nota()">Reset</button>
</body>
<script>
    let h2 = document.querySelector("h2")

    let count = 0;

    function data(){
        count++
        h2.innerText = count
    }
    function Cota(){
        if(0<count){
        count--
        h2.innerText = count
        }
    }
    function Nota(){
        count = 0
        h2.innerText = count
    }
</script>
</html>
