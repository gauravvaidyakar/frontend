<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #universal{
            display: flex;
            gap: 50px;
        }

        form{
            display: flex;
            flex-direction: column;
            width: 250px;
            margin-left: 20px;
            border: 1px solid;
            padding: 20px;
        }

       
    </style>
</head>
<body>
    <div id="universal">
    <form action="">
        <h1>profile info</h1>
        <br>
        <input type="text" placeholder="name" class="name">
        <br>
        <input type="text" placeholder="title" class="title">
        <br>
        <textarea name="" id="" placeholder="Descreption" class="Descreption"></textarea>
        <br>
        <input type="file" placeholder="Select profile page" class="Profile">
        <br>
        <button onclick="ProfileFn()">Add Profile</button>
    </form>

    <div id="bhaisahab">


    </div>
    </div>
</body>
<script>
    let name = document.querySelector(".name")
    let title = document.querySelector(".title")
    let Descreption = document.querySelector(".Descreption")
    let Profile = document.querySelector(".Profile")

    function ProfileFn(){
        event.preventDefault()
        if(name.value ==""||title.value==""||Descreption.value==""||Profile.value==""){
        return alert("this is not in network coverage area")
        }

        let div = document.createElement("div")
        div.style.border = "2px solid"
        div.style.padding = "10px"
        let img = document.createElement("img")
        img.src = URL.createObjectURL(Profile.files[0])
        img.style.height = "200px"
        img.style.width = "200px"

        let h2 = document.createElement("h2")
        h2.innerText = name.value

        let p = document.createElement("p")
        p.innerText = title.value

        let p2 = document.createElement("p")
        p2.innerText = Descreption.value

        div.append(img,h2,p,p2)
        bhaisahab.append(div)

        name.value = ""
        title.value = ""
        Descreption.value = ""
        Profile.value = ""
    }
</script>
</html>
