            padding: 20px;
            border-radius: 20px;
            margin-top: 50px;

        .name{
            background: transparent;
            border-radius: 10px;
        }
        .title{
            background-color: rgba(255, 255, 255, 0.226);
            border-radius: 10px;
        }
        .Descreption{
            background-color: rgba(255, 255, 255, 0.226);
            border-radius: 10px;
        }
        .file{
            background-color: rgba(255, 255, 255, 0.226);
            border-radius: 10px;
        }

            margin-top: 50px;
        }

            background-color: rgba(255, 255, 255, 0.226);
            border-radius: 10px;
        }

<body>
    <div id="main">
    <form action="">
        <h1>Profile Info</h1>
        <br>
        <input type="text" placeholder="name" class="name">
        <br>
        <input type="text" placeholder="title" class="title">
        <br>
        <textarea name="" id="" placeholder="Descreption" class="Descreption"></textarea>
        <br>
        <input type="file" placeholder="select profile image" class="file">
        <br>
        <button>Add Profile</button>
    </form>

    <div id="boss">
        
    </div>
    </div>
</body>
<script>
     let name = document.querySelector(".name")
     let title = document.querySelector(".title")
     let Descreption = document.querySelector(".Descreption")
     let file = document.querySelector(".file")
     let btn = document.querySelector("button")
     let boss = document.querySelector("#boss")

     btn.addEventListener("click",()=>{
        event.preventDefault()
        if(name.value ==""|| title.value=="" || Descreption.value==""||file.value==""){
            alert("aste kadam")
        }

        let div = document.createElement("div")
        div.style = "box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;"
        div.style.padding = "20px"
        div.style.borderRadius = "20px"

        let img = document.createElement("img")
        img.src = URL.createObjectURL(file.files[0])
        img.style.height = "200px"
        img.style.width = "200px"
        img.style.borderRadius = "50%"

        let h2 = document.createElement("h2")
        h2.innerText = name.value

        let p = document.createElement("p")
        p.innerText = title.value

        let p2 = document.createElement("p2")
        p2.innerText = Descreption.value

        div.append(img,h2,p,p2)
        boss.append(div)

        name.value = ""
        title.value = ""
        Descreption.value = ""
        file.value = ""
     })

</script>
</html>
